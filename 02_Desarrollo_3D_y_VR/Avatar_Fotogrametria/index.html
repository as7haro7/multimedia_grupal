<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Avatar 3D - Fotogrametría</title>
    <!-- Tu archivo CSS copiado en Netlify -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body style="text-align: center; margin: 0; padding: 0;">
    <!-- Fondo animado -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Encabezado con enlace a InfinityFree/GitHub -->
    <header style="position: relative; z-index: 10;">
        <a href="https://as7haro7.github.io/multimedia_grupal/"
            style="color: var(--text-secondary); text-decoration: none; position: absolute; top: 2rem; left: 2rem; font-size: 1.2rem;">
            <i class="fa-solid fa-arrow-left"></i> Volver al Inicio
        </a>
        <h1>Avatar Digital por Fotogrametría</h1>
        <p>Explora el modelo tridimensional exportado en Unity WebGL.</p>
    </header>

    <!-- Contenedor principal de la tarjeta -->
    <div class="content-page"
        style="width: 100%; display: block; padding: 1rem; max-width: 1000px; background: #ffffff; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin: 0 auto 3rem auto; border-radius: 16px;">

        <div
            style="width: 100%; height: 550px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <iframe src="https://avatar-fotogrametria-web.netlify.app/" width="100%" height="100%" frameborder="0"
                scrolling="no"></iframe>
        </div>

    </div>
</body>

</html>
