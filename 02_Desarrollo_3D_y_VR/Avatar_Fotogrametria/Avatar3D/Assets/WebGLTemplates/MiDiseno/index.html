<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | Avatar3D</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <!-- Enlace al CSS global del sistema principal -->
  <link rel="stylesheet" href="https://as7haro7.github.io/multimedia_grupal/styles.css">
</head>

<body>
  <!-- Fondo animado del sistema -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Encabezado con el estilo del sistema -->
  <header style="padding-top: 2rem; position: relative; z-index: 10;">
    <a href="https://as7haro7.github.io/multimedia_grupal/" class="btn btn-secondary"
      style="position: absolute; top: 1rem; left: 1rem; margin-top: 0; padding: 0.5rem 1rem;">
      ← Volver al Inicio
    </a>
    <h1 style="font-size: 2.5rem; margin-top: 1rem;">Avatar Digital</h1>
    <p>Explora el modelo tridimensional interactivo.</p>
  </header>

  <!-- Contenedor principal de la tarjeta -->
  <div class="content-page"
    style="width: 90%; max-width: 1000px; padding: 1rem; margin: 1rem auto 3rem auto; display: flex; flex-direction: column;">
    <div class="webgl-container"
      style="margin: 0; border: none; padding: 0; position: relative; width: 100%; flex-grow: 1;">
      <div id="unity-container" class="unity-desktop" style="width: 100%; height: 100%;">
        <canvas id="unity-canvas" style="width: 100%; height: 100%; display: block;" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer" style="display: none;">
          <div id="unity-logo-title-footer"></div>
          <div id="unity-fullscreen-button"></div>
          <div id="unity-build-title">Avatar3D</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Avatar2D",
      productVersion: "0.1.0",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      // En desktop también usamos 100% para ser responsivos dentro de la tarjeta
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);

  </script>
</body>

</html>
